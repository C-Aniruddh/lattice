<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Before the Bell</title>
<style>
  html, body { margin: 0; height: 100%; background: #1a1410; overscroll-behavior: none; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }

  .lattice-ui {
    --paper: #f6efe2;
    --dim: #b7a48a;
    --card: color-mix(in srgb, var(--lattice-ink, #2a1c16) 82%, transparent);
    --edge: color-mix(in srgb, var(--paper) 16%, transparent);
    --accent: var(--lattice-warn, #e8b14a);
    --crust: var(--lattice-brand, #b85a32);
    font: 500 13px/1.35 "Iowan Old Style", "Palatino Linotype", Palatino, "Times New Roman", serif;
    color: var(--paper);
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  .dock {
    position: absolute; left: 18px; top: 18px;
    display: flex; flex-direction: column; gap: 8px; max-width: 320px;
  }
  .dock-foot {
    position: absolute; top: auto; bottom: 18px; left: 18px; right: auto;
    max-width: 420px;
  }
  .lattice-layer-toasts {
    top: auto !important; bottom: 18px; right: 18px; left: auto;
    align-items: flex-end;
  }

  .card {
    position: relative; padding: 12px 15px 13px;
    background: var(--edge);
    clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 0 100%);
  }
  .card::before {
    content: ''; position: absolute; inset: 1px; clip-path: inherit;
    background: var(--card); transition: background-color 1.2s linear;
  }
  .card > * { position: relative; margin: 0; }

  .mark {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 10px; font-weight: 800; letter-spacing: .18em;
    color: var(--accent); text-transform: uppercase;
  }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin: 4px 0 0; }
  .lede { margin-top: 6px; font-size: 13.5px; line-height: 1.45; color: var(--paper); }

  .figures { display: flex; flex-direction: column; gap: 7px; min-width: 210px; }
  .row { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
  .key {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 10px; font-weight: 700; letter-spacing: .14em; color: var(--dim);
  }
  .val, .lattice-roll {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--paper);
  }
  .figures .row:first-child .lattice-roll { font-size: 28px; color: var(--accent); }
  .val.is-late { color: var(--lattice-bad, #b8483f); }
  .val.is-ok { color: var(--lattice-ok, #6e9c54); }

  .hint { font-size: 13px; color: var(--dim); }
  .hint strong { color: var(--paper); font-weight: 650; }

  .again {
    margin-top: 10px; padding: 8px 12px;
    font: inherit; font-size: 14px; font-weight: 700;
    color: #1a1410; background: var(--accent);
    border: 0; cursor: pointer; width: 100%;
  }
  .again:hover { filter: brightness(1.08); }

  .closed { display: none; }
  .closed.is-on { display: block; }

  .lattice-roll { display: inline-block; }
  .lattice-roll.bump { animation: bump 220ms cubic-bezier(.2, .9, .3, 1); }
  @keyframes bump { from { transform: scale(1.14); } to { transform: scale(1); } }

  .lattice-toast {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 12px; letter-spacing: .04em;
    padding: 8px 12px; background: var(--card); color: var(--paper);
    border-left: 3px solid var(--accent);
  }
  .lattice-toast-good { border-left-color: var(--lattice-ok, #6e9c54); }
  .lattice-toast-bad { border-left-color: var(--lattice-bad, #b8483f); }

  @media (prefers-reduced-motion: reduce) { .lattice-roll.bump { animation: none; } }
  @media (max-width: 560px) {
    .dock { left: 10px; top: 10px; right: 10px; max-width: none; }
    h1 { font-size: 18px; }
  }
</style>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
