<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Idle — a Lattice exhibit</title>
<style>
  /*
   * The overlay's whole appearance. `@latticekit/ui` ships no stylesheet. Every color resolves
   * through a custom property `hud.ts` pushes from the live palette, so the plate darkens with
   * the valley. Fallbacks are the dusk values, so the first paint is right before a frame runs.
   */
  html, body { margin: 0; height: 100%; background: #1a0e08; overscroll-behavior: none; }

  .lattice-ui {
    --paper: #f6ead4;
    --dim: #c4a888;
    --card: color-mix(in srgb, var(--lattice-ink, #140c08) 94%, #1a0e08);
    --edge: color-mix(in srgb, var(--lattice-warn, #ffb44a) 22%, transparent);
    --accent: var(--lattice-warn, #ffb44a);
    --cut: polygon(10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px),
                   calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px), 0 10px);
    font: 600 13px/1.3 ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace;
    color: var(--paper);
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  .card { position: relative; padding: 13px 16px; background: var(--edge); clip-path: var(--cut); }
  .card::before {
    content: ''; position: absolute; inset: 1px; clip-path: var(--cut);
    background: var(--card);
  }
  .card > * { position: relative; }

  .dock { position: absolute; display: flex; gap: 10px; }
  .dock-left { left: 18px; top: 18px; flex-direction: column; align-items: flex-start; max-width: 360px; }
  .dock-right { right: 18px; top: 18px; }

  .brief { min-width: 300px; }
  .brief-title {
    margin: 0 0 7px; font-size: 11px; font-weight: 800; letter-spacing: .24em;
    color: var(--accent);
  }
  .brief-line { margin: 0; font-size: 14px; line-height: 1.42; color: var(--paper); }

  .shop { min-width: 248px; }
  .coin-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .coin-k { font-size: 10px; letter-spacing: .2em; color: var(--accent); }
  .shop .lattice-roll {
    font-size: 28px; font-weight: 800; letter-spacing: .03em; font-variant-numeric: tabular-nums;
  }

  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; margin: 12px 0 10px; }
  .stat { display: flex; flex-direction: column; gap: 2px; }
  .stat-k { font-size: 9px; letter-spacing: .16em; color: var(--dim); }
  .stat-v { font-size: 14px; font-variant-numeric: tabular-nums; }

  .acts { display: flex; gap: 8px; margin: 4px 0 8px; }
  .act, .away {
    border: 0; cursor: pointer; clip-path: var(--cut); font: inherit; font-weight: 700;
    letter-spacing: .04em;
  }
  .act {
    flex: 1; padding: 9px 10px; background: color-mix(in srgb, var(--paper) 14%, transparent);
    color: var(--paper);
  }
  .act.is-on { background: var(--accent); color: var(--lattice-ink, #140c08); }
  .act[disabled] { opacity: .45; cursor: default; }
  .away {
    width: 100%; padding: 11px 12px; background: var(--accent); color: var(--lattice-ink, #140c08);
    font-size: 13px;
  }
  .away:hover { filter: brightness(1.08); }
  .act:focus-visible, .away:focus-visible { outline: 2px solid var(--paper); outline-offset: 3px; }

  .would, .last {
    margin: 8px 0 0; font-size: 12px; line-height: 1.35; color: var(--paper);
  }
  .perf {
    display: block; margin-top: 8px; font-size: 11px; font-weight: 700; letter-spacing: .08em;
    color: var(--paper);
    font-variant-numeric: tabular-nums;
  }

  .lattice-roll { display: inline-block; }
  .lattice-roll.bump { animation: bump 220ms cubic-bezier(.2, .9, .3, 1); }
  @keyframes bump { from { transform: scale(1.08); } to { transform: scale(1); } }

  .lattice-toast {
    position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%);
    padding: 10px 16px; background: var(--card); color: var(--paper); clip-path: var(--cut);
    letter-spacing: .03em; font-size: 13px;
  }
  .lattice-toast-good { color: var(--accent); }
  .lattice-toast-bar { display: none; }

  @media (prefers-reduced-motion: reduce) {
    .lattice-roll.bump { animation: none; }
  }
  @media (max-width: 620px) {
    .dock-left { max-width: calc(100vw - 36px); }
    .brief { min-width: 0; }
    .dock-right { top: auto; bottom: 18px; right: 12px; left: 12px; }
    .shop { min-width: 0; width: 100%; }
  }
</style>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
