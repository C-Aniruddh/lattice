<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Builder — Lattice Gallery</title>
<style>
  :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
  * { box-sizing: border-box; }
  html, body, #app { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #12262c; overscroll-behavior: none; }
  canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
  .hud { position: fixed; inset: 0; pointer-events: none; color: #f8f2da; text-shadow: 0 2px 8px #071114; }
  .title { position: absolute; left: 28px; top: 24px; padding: 16px 19px; border-left: 4px solid #ffc857; background: rgba(9,25,29,.88); box-shadow: 0 12px 30px rgba(0,0,0,.25); }
  .title b { display: block; font-size: 23px; letter-spacing: .12em; }
  .title span { display: block; margin-top: 5px; color: #c6d8d2; font-size: 13px; letter-spacing: .04em; }
  .status { position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); min-width: 340px; padding: 13px 18px; border-radius: 99px; text-align: center; color: #fff; font-weight: 800; letter-spacing: .06em; background: #09191d; border: 2px solid #58d68d; }
  .status.bad { border-color: #ff6b6b; color: #fff; }
  .cost { position: absolute; right: 24px; top: 24px; padding: 10px 13px; border-radius: 8px; background: rgba(9,25,29,.86); color: #eef8f3; font-size: 13px; }
  .tip { position: absolute; right: 24px; bottom: 24px; padding: 10px 13px; color: #d7e5df; background: rgba(9,25,29,.8); border-radius: 8px; font-size: 12px; }
</style>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
